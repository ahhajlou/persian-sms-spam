[package]
name = "spam-core-py"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Python binding for spam-core (module `spam_core`)"

[lib]
name = "spam_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module"] }
engine = { package = "spam-core", path = "../spam-core" }
