[project]
name = "spam-common"
version = "0.1.0"
description = "Shared data loading, preprocessing pipeline, train/test split and metrics for the Persian SMS spam models"
requires-python = ">=3.13"
dependencies = [
    "hazm>=0.12.1",  # normalizer used by spam_common.pipeline
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"
