# Anonymizer rules, generated from spam_common.anonymize (Python) and rewritten with
# core/tools/rx.py. Edit this file now; the Python rules go away in Phase 2.
# Explicit character classes only (no \d \w \s \b); a test enforces it.

# Step 1: character translation (Persian/Arabic digits -> ASCII, Arabic yeh/kaf -> Persian).
translate_src = "۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩يكى"
translate_dst = "01234567890123456789یکی"

# Step 2: format rules, in this order. The whole match becomes [TAG] unless the
# validator rejects it (then it stays and scanning continues after it).
# validator: "luhn" (16 bare digits must pass Luhn; grouped ones always pass)
#            "natid" (Iranian national ID check digit)

[[format]]
tag = "IBAN"
pattern = '''(?i)(?<![A-Za-z])IR[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}]?[0-9]{2}(?:[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}]?[0-9]){16,22}(?![0-9])'''

[[format]]
tag = "CARD"
pattern = '''(?<![0-9])[0-9]{4}(?:[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}-]?[0-9]{4}){3}(?![0-9])'''
validator = "luhn"

[[format]]
tag = "CARD"
pattern = '''(?<![0-9*#])[0-9]{4,6}[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}-]?[0-9]{0,2}[*xX×]+[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}\-*xX×0-9]{0,10}?[0-9]{2,4}(?![0-9])'''

[[format]]
tag = "ACCOUNT"
pattern = '''(?<![0-9])[0-9]{3,4}\.[0-9]{3,4}\.[0-9]{6,10}\.[0-9]{1,3}(?![0-9])'''

[[format]]
tag = "SECRET"
pattern = '''(?<=://)[^\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}/@]+(?=@)'''

[[format]]
tag = "EMAIL"
pattern = '''[\p{L}\p{N}_.+-]+@(?:[\p{L}\p{N}_-]+\.)+[A-Za-z]{2,}(?![\p{L}\p{N}_-])'''

[[format]]
tag = "PHONE"
pattern = '''(?<![0-9+])(?:\+98|0098|0)[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}]?9[0-9]{2}[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}-]?[0-9]{3}[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}-]?[0-9]{4}(?![0-9])'''

[[format]]
tag = "PHONE"
pattern = '''(?<![0-9])0[1-8][0-9]{1,2}[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}-]?[0-9]{7,8}(?![0-9])'''

[[format]]
tag = "NATID"
pattern = '''(?<![0-9])[0-9]{10}(?![0-9])'''
validator = "natid"

# Step 3: keyword rules. Group 1 (the keyword and filler) is kept, group 2 (the value)
# becomes [TAG].

[[keyword]]
tag = "PASSWORD"
pattern = '''(?i)((?<![\[A-Za-z])(?:رمز(?![\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}]?ارز|ینه)|کلمه[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}]?(?:ی[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}])?عبور|گذرواژه|پسورد|password|passcode|pin[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}]?code)(?![A-Za-z.])[^0-9\n\[*#/?\&]{0,25}?(?:[ \t]*\n[ \t]*)?)((?<![A-Za-z0-9_])(?!https?://|www\.|[\p{L}\p{N}_-]+\.[A-Za-z]{2,}(?:(?<=[\p{L}\p{N}_])(?![\p{L}\p{N}_])|(?<![\p{L}\p{N}_])(?=[\p{L}\p{N}_]))|(?:code|otp|pin|pass(?:word|code)?|user(?:name)?|login)(?:(?<=[\p{L}\p{N}_])(?![\p{L}\p{N}_])|(?<![\p{L}\p{N}_])(?=[\p{L}\p{N}_])))[A-Za-z0-9][A-Za-z0-9._@\-]{3,})'''

[[keyword]]
tag = "USERNAME"
pattern = '''(?i)((?<![\[A-Za-z])(?:نام[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}]?کاربری|شناسه[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}]?کاربری|username|user[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}]?name|user[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}]?id)(?![A-Za-z.])[^0-9\n\[*#/?\&]{0,25}?(?:[ \t]*\n[ \t]*)?)((?<![A-Za-z0-9_])(?!https?://|www\.|[\p{L}\p{N}_-]+\.[A-Za-z]{2,}(?:(?<=[\p{L}\p{N}_])(?![\p{L}\p{N}_])|(?<![\p{L}\p{N}_])(?=[\p{L}\p{N}_]))|(?:code|otp|pin|pass(?:word|code)?|user(?:name)?|login)(?:(?<=[\p{L}\p{N}_])(?![\p{L}\p{N}_])|(?<![\p{L}\p{N}_])(?=[\p{L}\p{N}_])))[A-Za-z0-9][A-Za-z0-9._@\-]{2,})'''

[[keyword]]
tag = "CODE"
pattern = '''(?i)((?<![\[A-Za-z])(?:کد|code|otp|پیگیری|رهگیری|مرجع|سفارش|مرسوله|@[\p{L}\p{N}_.-]+[\x{9}-\x{d}\x{1c}-\x{20}\x{85}\x{a0}\x{1680}\x{2000}-\x{200a}\x{2028}-\x{2029}\x{202f}\x{205f}\x{3000}]*#)(?![A-Za-z.])[^0-9\n\[*#/?\&]{0,25}?(?:[ \t]*\n[ \t]*)?)((?<![A-Za-z0-9_])(?=[A-Za-z0-9\-]{4})[A-Za-z0-9\-]*[0-9][A-Za-z0-9\-]*)'''

[[keyword]]
tag = "AMOUNT"
pattern = '''(?i)((?<![\[A-Za-z])(?:مانده|موجودی|برداشت|واریز|مبلغ|balance)(?![A-Za-z.])(?:(?!حساب|کارت)[^0-9\n\[*#/?\&]){0,25}?(?:[ \t]*\n[ \t]*)?)((?<![A-Za-z0-9_])[0-9][0-9,٬.]*)'''

[[keyword]]
tag = "ACCOUNT"
pattern = '''(?i)((?<![\[A-Za-z])(?:حساب|سپرده|account)(?![A-Za-z.])[^0-9\n\[*#/?\&]{0,25}?(?:[ \t]*\n[ \t]*)?)((?<![A-Za-z0-9_])[0-9][0-9.\-/]{3,})'''

# Step 4: any digit run this long that is left becomes [NUMBER].
[long_number]
pattern = '''(?<![0-9])[0-9]{8,}(?![0-9])'''
