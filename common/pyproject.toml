[project]
name = "spam-common"
version = "0.1.0"
description = "Shared data loading, preprocessing pipeline, train/test split and metrics for the Persian SMS spam models"
requires-python = ">=3.13"
dependencies = [
    "spam-core",  # the Rust preprocessing core (core/spam-core-py), built by maturin
]

[dependency-groups]
# Only for `make lexicons` and `make core-diff` (uv run --group reference). The pipeline
# itself never imports hazm; its rules and character tables are data in core/spam-core/rules.
reference = [
    "hazm>=0.12.1",
    "joblib>=1.6.0",
    "scikit-learn>=1.9.0",
]

[tool.uv.sources]
spam-core = { path = "../core/spam-core-py", editable = true }

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"
