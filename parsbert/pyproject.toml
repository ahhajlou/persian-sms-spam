[project]
name = "persian-sms-spam-parsbert"
version = "0.1.0"
description = "Persian SMS spam classifier: fine-tuned ParsBERT, exported to TFLite"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "ai-edge-litert>=2.2.0",
    "datasets>=5.0.1",
    "litert-torch>=0.9.4",
    "spam-common",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.16.1",
]

[tool.uv.sources]
spam-common = { path = "../common", editable = true }
